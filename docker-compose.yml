version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: rosstat_gmc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rosstat_user
      POSTGRES_PASSWORD: rosstat_password
      POSTGRES_DB: rosstat_gmc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosstat_user -d rosstat_gmc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
